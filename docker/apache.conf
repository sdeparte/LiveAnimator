<Directory /var/www/html/public>
    AllowOverride None
    # mod_php does not hand the "Authorization: Bearer" header (API JWT) to PHP.
    SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    DirectoryIndex /index.php
    FallbackResource /index.php
</Directory>
<Directory /var/www/html/public/bundles>
    DirectoryIndex disabled
    FallbackResource disabled
</Directory>

# Server-sent events: no buffering, and long-lived connections.
ProxyPass        /.well-known/mercure http://mercure/.well-known/mercure flushpackets=on timeout=3600
ProxyPassReverse /.well-known/mercure http://mercure/.well-known/mercure
